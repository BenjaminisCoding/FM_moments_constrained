[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfm-project"
version = "0.1.0"
description = "Generalized-moment interpolant flow matching and reproducible paper experiments."
requires-python = ">=3.12"
dependencies = [
  "hydra-core>=1.3.2,<2.0.0",
  "matplotlib>=3.9.0,<4.0.0",
  "numpy>=2.0.0,<3.0.0",
  "POT>=0.9.6,<1",
  "scikit-learn>=1.5.0,<2.0.0",
  "scipy>=1.14.0,<2.0.0",
  "torch>=2.4.0,<3.0.0",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
observations = [
  "xarray>=2025.1",
  "netCDF4>=1.7,<2",
]
single-cell = [
  "anndata>=0.10,<1",
  "pandas>=2.2,<3",
]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pandas>=2.2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
